    { name = "filelock", specifier = ">=3.13" },
    { name = "flask", specifier = ">=3.1.0" },
    { name = "flask-caching", specifier = ">=2.3.1" },
    { name = "google-api-python-client", specifier = ">=2.165.0" },
    { name = "gunicorn", specifier = ">=23.0.0" },
    { name = "isodate", specifier = ">=0.7.2" },
    { name = "markupsafe", specifier = ">=3.0.3" },
    { name = "requests", specifier = ">=2.32.3" },
    { name = "yt-dlp", extras = ["default"], specifier = ">=2025.3.21" },
]

[package.metadata.requires-dev]
dev = [
    { name = "pre-commit", specifier = ">=4.1.0" },
    { name = "pyrefly", specifier = ">=1.0.0" },
    { name = "pytest", specifier = ">=8.3.5" },
    { name = "pytest-cov", specifier = ">=6.0.0" },
    { name = "types-yt-dlp", specifier = ">=2026.3.17.20260510" },
]
